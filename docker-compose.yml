services:
  kanban-api:
    build: .
    container_name: kanban-api
    restart: unless-stopped
    # Sem porta pública: a API só é acessível internamente pelo Caddy.
    # (Se quiser testar direto na 8080, troque por: ports: ["8080:8080"])
    expose:
      - "8080"
    env_file:
      - .env

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kanban-api

volumes:
  caddy_data:
  caddy_config:
